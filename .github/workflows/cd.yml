name: NightBuild CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: nightbuild-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out NightBuild
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag does not exist: $RELEASE_TAG"
            exit 1
          fi

          SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "Release tag: $RELEASE_TAG"
          echo "Release commit: $SHA"

      - name: Wait for successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            RUNS="$(gh run list \
              --repo "$GH_REPO" \
              --workflow ci.yml \
              --commit "$RELEASE_SHA" \
              --limit 100 \
              --json headSha,status,conclusion)"

            if echo "$RUNS" | jq -e \
              --arg sha "$RELEASE_SHA" \
              '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' \
              >/dev/null; then
              echo "Successful CI run found for $RELEASE_SHA"
              exit 0
            fi

            echo "Waiting for successful CI ($attempt/60)..."
            sleep 10
          done

          echo "No successful CI run found for $RELEASE_SHA"
          exit 1

  release:
    name: Build and publish release
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out NightBuild
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Confirm release commit
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          set -euo pipefail

          CHECKOUT_SHA="$(git rev-parse HEAD)"

          if [ "$CHECKOUT_SHA" != "$RELEASE_SHA" ]; then
            echo "Checked-out commit does not match the verified release commit."
            echo "Expected: $RELEASE_SHA"
            echo "Actual:   $CHECKOUT_SHA"
            exit 1
          fi

      - name: Build optimized release
        run: |
          set -euo pipefail
          python3 bootstrap.py
          ./nightbuild gen --no-license -C out/Official
          ./nightbuild build --no-license -C out/Official nightbuild-release

      - name: Prepare release package
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [ ! -f nightbuild-release ]; then
            echo "Expected executable not found: nightbuild-release"
            echo "Repository root:"
            ls -la

            if [ -d out/Official ]; then
              echo "Official build output:"
              find out/Official -maxdepth 3 -type f -print
            fi

            exit 1
          fi

          mkdir -p release
          cp nightbuild-release release/nightbuild
          chmod +x release/nightbuild

          file release/nightbuild

          tar -czf "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz" \
            -C release nightbuild

          shasum -a 256 \
            "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz" \
            > "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz.sha256"

          cat "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz" \
            "nightbuild-${RELEASE_TAG}-macos-arm64.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NightBuild $RELEASE_TAG" \
            --generate-notes
