name: NightBuild CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out NightBuild
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run bootstrap and build
        run: python3 bootstrap.py