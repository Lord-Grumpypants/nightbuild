name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # Runs your all-in-one bootstrap and build sequence on macOS 26
    - name: Run NightBuild Bootstrap and Build
      shell: arch -arm64 /bin/bash {0}
      run: python3 bootstrap.py


    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
